<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
  <defs>
    <linearGradient id="box-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accent-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="480" rx="16" fill="#070b14" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <text x="40" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#f8fafc" letter-spacing="0.5">
    VAULTTAB CRYPTOGRAPHIC ARCHITECTURE &amp; KEY ISOLATION MODEL
  </text>
  <text x="40" y="68" font-family="ui-monospace, monospace" font-size="12" fill="#64748b">
    Zero-Knowledge Memory Boundary · WebAuthn FIDO2 Attestation · Authenticated Symmetric Encryption
  </text>

  <!-- SECTION 1: AUTHENTICATION & DERIVATION -->
  <g transform="translate(40, 100)">
    <!-- Node A: Password Input -->
    <rect width="200" height="90" rx="10" fill="url(#box-bg)" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">1. Master Password</text>
    <text x="20" y="52" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">User entropy input</text>
    <rect x="20" y="62" width="130" height="18" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="28" y="75" font-family="ui-monospace, monospace" font-size="10" fill="#fbbf24">••••••••••••••••</text>
    
    <!-- Arrow A -> B -->
    <path d="M 200 45 L 260 45" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="205" y="36" font-family="ui-monospace, monospace" font-size="9" fill="#38bdf8">Salt + Salt_IV</text>

    <!-- Node B: PBKDF2 Engine -->
    <g transform="translate(270, 0)">
      <rect width="210" height="90" rx="10" fill="url(#box-bg)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">2. PBKDF2-HMAC-SHA256</text>
      <text x="18" y="48" font-family="ui-monospace, monospace" font-size="11" fill="#f1f5f9">600,000 Iterations</text>
      <text x="18" y="68" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">OWASP 2024 Hardened Spec</text>
    </g>

    <!-- Arrow B -> C -->
    <path d="M 480 45 L 540 45" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="485" y="36" font-family="ui-monospace, monospace" font-size="9" fill="#38bdf8">256-bit Key</text>

    <!-- Node C: WebAuthn Passkey (Hardware 2FA) -->
    <g transform="translate(550, 0)">
      <rect width="210" height="90" rx="10" fill="url(#box-bg)" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">3. WebAuthn Hardware 2FA</text>
      <text x="18" y="48" font-family="ui-monospace, monospace" font-size="11" fill="#f1f5f9">FIDO2 / TouchID / YubiKey</text>
      <text x="18" y="68" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">Raw COSE/CBOR ECDSA Verification</text>
    </g>

    <!-- Arrow C -> D -->
    <path d="M 760 45 L 820 45" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  </g>

  <!-- SECTION 2: SESSION KEY ISOLATION IN RAM -->
  <g transform="translate(860, 100)">
    <!-- Node D: Ephemeral RAM -->
    <rect width="100" height="230" rx="10" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="2" filter="url(#glow)"/>
    <text x="14" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#34d399">ACTIVE</text>
    <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#34d399">SESSION</text>
    <text x="14" y="80" font-family="ui-monospace, monospace" font-size="10" fill="#a7f3d0">RAM Only</text>
    <text x="14" y="100" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">chrome.</text>
    <text x="14" y="114" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">storage.</text>
    <text x="14" y="128" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">session</text>
    <text x="14" y="160" font-family="ui-monospace, monospace" font-size="9" fill="#fef08a">Auto-Locks</text>
    <text x="14" y="176" font-family="ui-monospace, monospace" font-size="9" fill="#fef08a">on idle</text>
    <text x="14" y="208" font-family="ui-monospace, monospace" font-size="9" fill="#f87171">Zero disk</text>
    <text x="14" y="222" font-family="ui-monospace, monospace" font-size="9" fill="#f87171">leakage</text>
  </g>

  <!-- SECTION 3: CLIENT-SIDE ENCRYPTED APPLICATION PIPELINE -->
  <g transform="translate(40, 240)">
    <!-- Encryption Bus Arrow -->
    <path d="M 820 115 L 720 115" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="735" y="105" font-family="ui-monospace, monospace" font-size="10" fill="#34d399">AES-256-GCM (12-byte IV + Tag)</text>

    <!-- Node E: Application Data Layers -->
    <g transform="translate(0, 50)">
      <!-- Box 1: Tab Groups -->
      <g transform="translate(0, 0)">
        <rect width="210" height="85" rx="8" fill="url(#box-bg)" stroke="#38bdf8" stroke-width="1"/>
        <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Encrypted Tab Vault</text>
        <text x="16" y="48" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">Session groups, URL metadata</text>
        <text x="16" y="68" font-family="ui-monospace, monospace" font-size="10" fill="#38bdf8">100% Client-Side Plaintext</text>
      </g>

      <!-- Box 2: Neural Embedder -->
      <g transform="translate(230, 0)">
        <rect width="230" height="85" rx="8" fill="url(#box-bg)" stroke="#c084fc" stroke-width="1"/>
        <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Word2Vec Neural Model</text>
        <text x="16" y="48" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">Skip-gram + Neg Sampling O(k+1)</text>
        <text x="16" y="68" font-family="ui-monospace, monospace" font-size="10" fill="#c084fc">Int8 Quantized Weight Matrix</text>
      </g>

      <!-- Box 3: Storage at Rest -->
      <g transform="translate(480, 0)">
        <rect width="220" height="85" rx="8" fill="url(#box-bg)" stroke="#10b981" stroke-width="1"/>
        <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Encrypted Storage at Rest</text>
        <text x="16" y="48" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">IndexedDB Chunked Fallback</text>
        <text x="16" y="68" font-family="ui-monospace, monospace" font-size="10" fill="#34d399">Optional Google Drive Sync</text>
      </g>
    </g>
  </g>

  <!-- Security Boundary Footer -->
  <g transform="translate(40, 420)">
    <rect width="920" height="38" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="20" y="24" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">SECURITY GUARANTEE:</text>
    <text x="165" y="24" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">
      Zero plaintext leaves local browser storage. No analytics, no telemetry, no remote telemetry servers.
    </text>
  </g>
</svg>
