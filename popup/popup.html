<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aegis Tab</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="locked-view">
    <div class="container">
      <h1>Aegis Tab</h1>
      <div id="setup-view" class="hidden">
        <h2>Create Master Password</h2>
        <div class="form-group">
          <div class="password-wrapper">
            <input type="password" id="setup-password" placeholder="Enter password" />
            <button type="button" class="password-toggle" data-target="setup-password" tabindex="-1">Show</button>
          </div>
          <div id="password-strength-bar" class="password-strength-bar"></div>
          <div id="password-strength-text" class="password-strength-text"></div>
        </div>
        <div class="form-group">
          <div class="password-wrapper">
            <input type="password" id="setup-password-confirm" placeholder="Confirm password" />
            <button type="button" class="password-toggle" data-target="setup-password-confirm" tabindex="-1">Show</button>
          </div>
        </div>
        <div id="setup-error" class="error-message hidden"></div>
        <button id="setup-button" class="primary-button">Create Password</button>
      </div>
      <div id="unlock-view" class="hidden">
        <h2>Unlock Aegis Tab</h2>
        <div class="form-group">
          <div class="password-wrapper">
            <input type="password" id="unlock-password" placeholder="Enter password" />
            <button type="button" class="password-toggle" data-target="unlock-password" tabindex="-1">Show</button>
          </div>
        </div>
        <div id="unlock-error" class="error-message hidden"></div>
        <button id="unlock-button" class="primary-button">Unlock</button>
      </div>
    </div>
  </div>

  <div id="unlocked-view" class="hidden">
    <div class="container">
      <h1>Aegis Tab</h1>
      <p>Your tabs are secured</p>
      <div class="button-group">
        <button id="save-tabs-button" class="primary-button">Save All Tabs</button>
        <button id="save-current-tab-button" class="secondary-button">Save This Tab</button>
        <button id="view-tabs-button" class="secondary-button">View Saved Tabs</button>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
