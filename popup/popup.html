<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultTab</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="locked-view">
    <div class="container">
      <h1>VaultTab</h1>

      <!-- setup view: first time creating a user -->
      <div id="setup-view" class="hidden">
        <h2>Create Account</h2>
        <div class="form-group">
          <input type="text" id="setup-username" placeholder="Username" />
        </div>
        <div class="form-group">
          <div class="password-wrapper">
            <input type="password" id="setup-password" placeholder="Enter password" />
            <button type="button" class="password-toggle" data-target="setup-password" tabindex="-1">Show</button>
          </div>
          <div id="password-strength-bar" class="password-strength-bar"></div>
          <div id="password-strength-text" class="password-strength-text"></div>
        </div>
        <div class="form-group">
          <div class="password-wrapper">
            <input type="password" id="setup-password-confirm" placeholder="Confirm password" />
            <button type="button" class="password-toggle" data-target="setup-password-confirm" tabindex="-1">Show</button>
          </div>
        </div>
        <div id="setup-error" class="error-message hidden"></div>
        <button id="setup-button" class="primary-button">Create Account</button>
      </div>

      <!-- unlock view: returning user -->
      <div id="unlock-view" class="hidden">
        <h2>Unlock VaultTab</h2>
        <div id="unlock-username-wrapper" class="form-group hidden">
          <select id="unlock-username-select" class="username-select">
            <option value="">Select user...</option>
          </select>
        </div>
        <div class="form-group">
          <div class="password-wrapper">
            <input type="password" id="unlock-password" placeholder="Enter password" />
            <button type="button" class="password-toggle" data-target="unlock-password" tabindex="-1">Show</button>
          </div>
        </div>
        <div id="unlock-error" class="error-message hidden"></div>
        <button id="unlock-button" class="primary-button">Unlock</button>
        <p class="secondary-link"><a href="#" id="popup-show-setup-link">Create a new account instead</a></p>
      </div>
    </div>
  </div>

    <!-- unlocked view -->
  <div id="unlocked-view" class="hidden">
    <div class="container">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 4px;">
        <h1 style="margin:0; font-size:20px;">VaultTab</h1>
        <span style="font-size:10px; font-weight:700; background:rgba(16,185,129,0.15); color:#10b981; border:1px solid rgba(16,185,129,0.3); padding:2px 6px; border-radius:4px;">Armed</span>
      </div>
      <p style="margin-bottom:12px; font-size:12px; text-align:left;">User: <strong id="current-user-label" class="user-label" style="color:#fff;"></strong></p>

      <div id="popup-tab-stats" style="background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); padding:8px 12px; border-radius:8px; font-size:11px; color:var(--text-secondary); margin-bottom:12px; display:flex; align-items:center; gap:6px;">
        <span>💾</span> <span id="popup-tab-stats-text">Analyzing tabs...</span>
      </div>

      <div class="form-group" style="margin-bottom:10px;">
        <input type="text" id="popup-session-name" placeholder="Session name (e.g. DeFi Audit, Dev Stack)" style="padding:10px; font-size:12px;" />
      </div>

      <div class="button-group">
        <label class="burner-toggle-label" style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-secondary);cursor:pointer;margin-bottom:8px;">
          <input type="checkbox" id="popup-burner-toggle" />
          <span>🔥 Burner (Self-Destruct on Restore)</span>
        </label>
        <button id="save-tabs-button" class="primary-button" style="padding:12px; font-weight:600;">Save All Tabs (Alt+Shift+S)</button>
        <button id="save-current-tab-button" class="secondary-button">Save Current Tab (Ctrl+Shift+S)</button>
        <button id="view-tabs-button" class="secondary-button" style="border-color:rgba(255,255,255,0.2);">Open Manager (⌘K)</button>
        <div style="display:flex; gap:8px; margin-top:4px;">
          <button id="popup-add-account-button" class="secondary-button" style="flex:1; font-size:11px;">+ Account</button>
          <button id="popup-lock-button" class="secondary-button" style="flex:1; font-size:11px; color:var(--error); border-color:rgba(244,67,54,0.3);">Lock</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
