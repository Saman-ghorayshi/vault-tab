<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VaultTab Studio Mockup Simulator</title>
<style>
  :root {
    --bg-window: #090d16;
    --bg-header: #0d1322;
    --bg-surface: #111a2e;
    --bg-surface-elevated: #16223b;
    --border: #1f2c47;
    --border-bright: #38bdf8;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --text-dim: #64748b;
    --cyan: #38bdf8;
    --cyan-dim: rgba(56, 189, 248, 0.12);
    --emerald: #10b981;
    --emerald-dim: rgba(16, 185, 129, 0.15);
    --amber: #fbbf24;
    --amber-dim: rgba(251, 191, 36, 0.15);
    --purple: #c084fc;
    --purple-dim: rgba(192, 132, 252, 0.15);
    --danger: #ef4444;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 960px;
    height: 580px;
    overflow: hidden;
    background: #03060b;
    font-family: var(--font-sans);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
  }

  /* Browser Window Mockup */
  .browser-window {
    width: 940px;
    height: 560px;
    background: var(--bg-window);
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(56, 189, 248, 0.15);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* Browser Topbar / Tabs Bar */
  .chrome-topbar {
    background: var(--bg-header);
    height: 42px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
    user-select: none;
  }
  .window-controls {
    display: flex;
    gap: 7px;
    align-items: center;
    padding-right: 6px;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot-red { background: #ef4444; box-shadow: 0 0 6px rgba(239, 68, 68, 0.4); }
  .dot-yellow { background: #f59e0b; box-shadow: 0 0 6px rgba(245, 158, 11, 0.4); }
  .dot-green { background: #10b981; box-shadow: 0 0 6px rgba(16, 185, 129, 0.4); }

  .tab-strip {
    display: flex;
    gap: 4px;
    align-items: flex-end;
    flex: 1;
    overflow: hidden;
    height: 100%;
    padding-top: 6px;
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 12px;
    border-radius: 8px 8px 0 0;
    font-size: 11px;
    font-weight: 500;
    max-width: 130px;
    min-width: 90px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: rgba(255, 255, 255, 0.04);
    color: var(--text-muted);
    border: 1px solid transparent;
    border-bottom: none;
    cursor: default;
    position: relative;
  }
  .tab.active {
    background: var(--bg-window);
    color: #fff;
    border-color: var(--border);
    border-bottom: 1px solid var(--bg-window);
    font-weight: 600;
  }
  .tab-icon { font-size: 11px; flex-shrink: 0; }
  .tab-title { overflow: hidden; text-overflow: ellipsis; }
  .tab-close { margin-left: auto; font-size: 10px; color: var(--text-dim); }

  /* Navigation Bar */
  .chrome-nav {
    background: var(--bg-window);
    height: 38px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 10px;
    border-bottom: 1px solid var(--border);
  }
  .nav-btn {
    color: var(--text-dim);
    font-size: 13px;
    display: flex;
    align-items: center;
    cursor: default;
  }
  .omnibox {
    flex: 1;
    height: 26px;
    background: #04070e;
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
  }
  .omnibox .ssl-lock { color: var(--emerald); font-size: 10px; }
  .omnibox .url-host { color: #fff; font-weight: 600; }
  .omnibox .url-path { color: var(--text-dim); }

  .browser-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .ram-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-family: var(--font-mono);
    font-weight: 600;
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5;
  }
  .ram-badge.freed {
    background: var(--emerald-dim);
    border-color: rgba(16, 185, 129, 0.3);
    color: var(--emerald);
  }
  .extension-icon {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    cursor: default;
    position: relative;
  }
  .extension-icon.vault-hover {
    border-color: var(--cyan);
    background: var(--cyan-dim);
  }
  .extension-icon.vault-active {
    background: var(--cyan-dim);
    border-color: var(--cyan);
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.45);
  }
  .extension-icon svg { width: 14px; height: 14px; }

  /* Viewport Content */
  .viewport {
    flex: 1;
    background: #060911;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Screen 1 & 2: Active Webpage (Raydium Swap Mockup) */
  .webpage-mock {
    flex: 1;
    padding: 24px 32px;
    display: flex;
    flex-direction: column;
    background: radial-gradient(circle at 80% 20%, rgba(192, 132, 252, 0.05), transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(56, 189, 248, 0.05), transparent 50%), #060911;
  }
  .mock-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  .mock-brand {
    font-weight: 800;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #fff;
  }
  .mock-brand-badge {
    background: linear-gradient(135deg, #a855f7, #6366f1);
    color: #fff;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: var(--font-mono);
  }
  .mock-swap-card {
    width: 400px;
    margin: 10px auto;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
  }
  .mock-swap-head {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 14px;
    color: var(--text);
  }
  .mock-token-row {
    background: #090e1a;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .mock-token-info { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; }
  .mock-token-icon { width: 22px; height: 22px; border-radius: 50%; }
  .mock-token-val { font-family: var(--font-mono); font-size: 15px; font-weight: 700; color: #fff; }

  /* Extension Popup (Drop-down) */
  .vault-popup-overlay {
    position: absolute;
    top: 4px;
    right: 12px;
    width: 320px;
    background: #0c1220;
    border: 1px solid var(--cyan);
    border-radius: 10px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.85), 0 0 20px rgba(56, 189, 248, 0.25);
    z-index: 100;
    padding: 16px;
    font-family: var(--font-sans);
  }
  .popup-brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
  }
  .popup-brand-title {
    font-size: 13px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 6px;
    color: #fff;
  }
  .popup-badge-sec {
    font-size: 9px;
    background: var(--emerald-dim);
    border: 1px solid var(--emerald);
    color: var(--emerald);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-weight: 700;
  }
  .popup-status-box {
    background: #060911;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    margin-bottom: 12px;
    font-size: 11px;
    color: var(--text-muted);
  }
  .popup-status-box strong { color: var(--text); }
  .popup-btn-primary {
    width: 100%;
    background: var(--cyan);
    color: #040812;
    border: none;
    border-radius: 6px;
    padding: 10px;
    font-weight: 700;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: default;
    margin-bottom: 8px;
    box-shadow: 0 4px 12px rgba(56, 189, 248, 0.35);
  }
  .popup-btn-primary.hover-btn {
    background: #7dd3fc;
    box-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
  }
  .popup-btn-primary.encrypting {
    background: linear-gradient(90deg, #0284c7, #38bdf8);
    color: #fff;
  }
  .popup-btn-secondary {
    width: 100%;
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    font-size: 11px;
    font-weight: 600;
    cursor: default;
  }

  /* Screen 4 & 5: VaultTab Manager Dashboard */
  .manager-view {
    flex: 1;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    background: #080c16;
    overflow-y: auto;
  }
  .manager-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .manager-title-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .manager-h1 { font-size: 18px; font-weight: 800; color: #fff; }
  .manager-badge {
    background: var(--cyan-dim);
    color: var(--cyan);
    border: 1px solid rgba(56, 189, 248, 0.3);
    font-size: 10px;
    font-family: var(--font-mono);
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 700;
  }
  .manager-search-bar {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 16px;
  }
  .manager-search-input {
    flex: 1;
    background: #04070e;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    color: #fff;
    font-family: var(--font-mono);
  }
  .manager-search-input.active-input {
    border-color: var(--cyan);
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
  }
  .semantic-toggle-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(192, 132, 252, 0.12);
    border: 1px solid rgba(192, 132, 252, 0.3);
    color: var(--purple);
    font-size: 11px;
    font-family: var(--font-mono);
    padding: 6px 10px;
    border-radius: 6px;
    font-weight: 700;
  }

  /* Tab Groups Grid / Cards */
  .groups-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .session-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .session-card.highlighted {
    border-color: var(--cyan);
    background: #111e38;
    box-shadow: 0 0 16px rgba(56, 189, 248, 0.15);
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .session-title {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cipher-pill {
    font-size: 9px;
    font-family: var(--font-mono);
    font-weight: 700;
    background: rgba(16, 185, 129, 0.1);
    color: var(--emerald);
    border: 1px solid rgba(16, 185, 129, 0.3);
    padding: 2px 6px;
    border-radius: 4px;
  }
  .card-tabs-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-left: 12px;
    border-left: 2px solid var(--border);
  }
  .tab-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--text-muted);
  }
  .tab-row strong { color: var(--text); }
  .match-score {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--purple);
    background: var(--purple-dim);
    padding: 1px 6px;
    border-radius: 4px;
    font-weight: 700;
  }
  .card-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 4px;
  }
  .btn-sm-primary {
    background: var(--cyan);
    color: #04070e;
    border: none;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 4px;
    cursor: default;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .btn-sm-sec {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: default;
  }

  /* Hardware Passkey / WebAuthn Modal */
  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(3, 6, 11, 0.85);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
  }
  .passkey-modal {
    width: 360px;
    background: #0f172a;
    border: 1px solid var(--cyan);
    border-radius: 12px;
    padding: 24px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 25px rgba(56, 189, 248, 0.3);
  }
  .fingerprint-icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: var(--cyan-dim);
    border: 2px solid var(--cyan);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
  }
  .fingerprint-icon.verified {
    border-color: var(--emerald);
    background: var(--emerald-dim);
    box-shadow: 0 0 25px rgba(16, 185, 129, 0.5);
  }
  .fingerprint-icon svg { width: 28px; height: 28px; }
  .modal-title { font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 6px; }
  .modal-desc { font-size: 11px; color: var(--text-muted); margin-bottom: 16px; line-height: 1.5; }
  .modal-status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 10px;
    font-family: var(--font-mono);
    font-weight: 700;
    background: var(--emerald-dim);
    border: 1px solid var(--emerald);
    color: var(--emerald);
  }

  /* Floating Toast */
  .toast-banner {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.96);
    border: 1px solid var(--emerald);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(16, 185, 129, 0.3);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 11px;
    font-family: var(--font-mono);
    font-weight: 600;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 150;
    white-space: nowrap;
  }
  .toast-banner svg { width: 14px; height: 14px; color: var(--emerald); }

  /* Command Palette Modal (Ctrl+K) */
  .cmd-palette-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(3, 6, 11, 0.82);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 60px;
    z-index: 250;
  }
  .cmd-palette-box {
    width: 520px;
    background: #0d1527;
    border: 1px solid var(--border-bright);
    border-radius: 12px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 30px rgba(56, 189, 248, 0.25);
    overflow: hidden;
    font-family: var(--font-sans);
  }
  .cmd-palette-input-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: #080d1a;
  }
  .cmd-palette-input-wrap span { font-size: 18px; color: var(--cyan); }
  .cmd-palette-search {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-size: 14px;
    color: #fff;
    font-family: var(--font-sans);
  }
  .cmd-palette-list {
    padding: 8px;
    max-height: 280px;
  }
  .cmd-group-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    font-weight: 700;
    padding: 6px 10px 4px;
    font-family: var(--font-mono);
  }
  .cmd-palette-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 12px;
    border-radius: 6px;
    font-size: 12px;
    color: var(--text-muted);
    cursor: default;
  }
  .cmd-palette-item.active {
    background: var(--cyan-dim);
    color: #fff;
    border: 1px solid rgba(56, 189, 248, 0.4);
  }
  .cmd-item-left {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
  }
  .cmd-badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-dim);
    font-family: var(--font-mono);
  }
  .cmd-palette-footer {
    display: flex;
    justify-content: space-between;
    padding: 8px 16px;
    background: #070b14;
    border-top: 1px solid var(--border);
    font-size: 10px;
    color: var(--text-dim);
    font-family: var(--font-mono);
  }

  /* Freeze-Frame Audit Proof Card */
  .proof-modal-box {
    width: 480px;
    background: #0c1424;
    border: 1px solid var(--emerald);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 30px rgba(16, 185, 129, 0.3);
    font-family: var(--font-sans);
  }
  .proof-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
    margin-bottom: 14px;
  }
  .proof-header-title {
    font-size: 14px;
    font-weight: 800;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .proof-digest-box {
    background: #060911;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font-family: var(--font-mono);
    font-size: 10px;
    line-height: 1.6;
    margin-bottom: 14px;
  }

  /* Animated Simulated Cursor */
  .virtual-cursor {
    position: absolute;
    width: 20px;
    height: 20px;
    z-index: 9999;
    pointer-events: none;
    transition: all 0.3s ease;
  }
  .virtual-cursor svg {
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
  }
</style>
</head>
<body>

<div class="browser-window" id="window">
  <!-- Top Tab Bar -->
  <div class="chrome-topbar">
    <div class="window-controls">
      <div class="dot dot-red"></div>
      <div class="dot dot-yellow"></div>
      <div class="dot dot-green"></div>
    </div>
    <div class="tab-strip" id="tab-strip"></div>
  </div>

  <!-- Navigation Bar -->
  <div class="chrome-nav">
    <div class="nav-btn">←</div>
    <div class="nav-btn">→</div>
    <div class="nav-btn">↻</div>
    <div class="omnibox">
      <span class="ssl-lock">🔒</span>
      <span id="url-text"></span>
    </div>
    <div class="browser-actions">
      <div class="ram-badge" id="ram-badge">
        <span>⚠️ RAM: 2,140 MB</span>
      </div>
      <div class="extension-icon" id="ext-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M9 12l2 2 4-4" stroke="#38bdf8" stroke-width="2.5"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Viewport -->
